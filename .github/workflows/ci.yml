name: CI

on: [push, pull_request]

jobs:
  backend:
    name: 后端 lint + 类型检查 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff 检查与格式校验
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy 类型检查
        run: mypy deep_research
      - name: Pytest（离线，跳过需要 PostgreSQL 的用例）
        run: pytest -m "not pg"

  # 需要真实 PostgreSQL 的 repository 集成测试，独立 job 用 service container
  backend-pg:
    name: 后端 PostgreSQL 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dr
          POSTGRES_PASSWORD: dr
          POSTGRES_DB: deep_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dr:dr@localhost:5432/deep_research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest（仅 PostgreSQL 集成用例）
        run: pytest -m pg

  frontend:
    name: 前端 lint + 构建 + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查与构建
        run: npm run build
      - name: 单元测试
        run: npm run test
