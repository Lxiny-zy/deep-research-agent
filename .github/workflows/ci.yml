name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  supply-chain:
    name: 供应链审计与 SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装带哈希的审计工具链
        run: pip install --require-hashes -r requirements-dev.lock
      - name: 校验直接依赖与锁文件一致性
        run: python scripts/check_dependency_locks.py
      - name: 审计 Python 生产依赖
        run: python -m pip_audit -r requirements.lock -r requirements-pdf.lock --progress-spinner off
      - name: 审计前端依赖
        working-directory: frontend
        run: npm audit --audit-level=moderate --package-lock-only
      - name: 生成 CycloneDX SBOM
        run: |
          mkdir -p sbom
          python -m pip_audit -r requirements.lock -r requirements-pdf.lock --progress-spinner off --format cyclonedx-json --output sbom/python-runtime.cdx.json
          cd frontend
          npm sbom --package-lock-only --sbom-format cyclonedx > ../sbom/frontend.cdx.json
      - name: 保存 SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom-${{ github.sha }}
          path: sbom/*.json
          if-no-files-found: error
          retention-days: 14

  backend:
    name: 后端 lint + 类型检查 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: 安装依赖
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Ruff 检查与格式校验
        run: |
          ruff check deep_research tests alembic scripts eval
          ruff format --check deep_research tests alembic scripts eval
      - name: Mypy 类型检查
        run: mypy deep_research
      - name: Pytest（离线，跳过需要 PostgreSQL 的用例）
        run: |
          pytest -m "not pg" --cov=deep_research --cov-report=term-missing --cov-fail-under=80
      - name: 独立 API / worker 的真实 HTTP 验收
        run: python scripts/verify_worker_http.py
      - name: 保存跨进程验收日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-http
          path: artifacts/worker-http/
          retention-days: 14

  # 需要真实 PostgreSQL 的 repository 集成测试，独立 job 用 service container
  backend-pg:
    name: 后端 PostgreSQL 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dr
          POSTGRES_PASSWORD: dr
          POSTGRES_DB: deep_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dr:dr@localhost:5432/deep_research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: 安装依赖
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Alembic 迁移到最新版本
        run: python -m deep_research.migrate
      - name: Alembic 模型漂移检查
        run: alembic check
      - name: Alembic 最新版本回滚与重放
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Pytest（仅 PostgreSQL 集成用例）
        run: pytest -m pg

  package:
    name: Wheel 构建与隔离安装
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建前端静态资源
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 安装构建依赖
        run: pip install --require-hashes -r requirements-dev.lock
      - name: 检查 OpenAPI 生成类型
        working-directory: frontend
        run: npm run api:check
      - name: 构建 wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: 在隔离环境安装并冒烟
        run: |
          python -m venv .ci-wheel-venv
          .ci-wheel-venv/bin/python -m pip install --require-hashes -r requirements.lock
          .ci-wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          .ci-wheel-venv/bin/python -m pip check
          .ci-wheel-venv/bin/deep-research --help
          .ci-wheel-venv/bin/python scripts/smoke_installed_package.py

  frontend:
    name: 前端 lint + 构建 + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查与构建
        run: npm run build
      - name: 首屏与分块体积门槛
        run: npm run check:bundle
      - name: 单元测试
        run: npm run test

  browser:
    name: 检索资源与工作区浏览器验收
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: python scripts/verify_search_resources_ui.py
      - run: python scripts/verify_workspace_ui.py --label ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-regressions
          path: |
            artifacts/ui-search/
            artifacts/ui-workspace/
          retention-days: 14

  container:
    name: Docker 生产镜像
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      API_KEY: ci-api-key
      CATALOG_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验 Compose 配置
        run: docker compose config --quiet
      - name: 启动生产栈并验证默认入口
        run: |
          docker compose up --build --detach
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/readyz; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz
          image_id="$(docker compose images -q api)"
          if docker run --rm "$image_id" sh -c 'exit 0'; then
            echo "production image unexpectedly accepted missing deployment configuration" >&2
            exit 1
          fi
          docker compose exec -T api python - < scripts/smoke_container.py
          docker compose exec -T api python - --expect-unavailable < scripts/verify_runner_sandbox.py
          docker compose exec -T api python -m alembic check

  runner-sandbox:
    name: Linux 命令沙箱与真实解压
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements.lock
      - name: 安装隔离工具（不修改系统 namespace 策略）
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libarchive-tools util-linux
      - name: 验证文件/网络隔离、资源限制、超时与归档处理
        run: python -m scripts.verify_runner_sandbox
