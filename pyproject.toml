[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Science Research：面向科研人员的研究工作台（文献综述、论文精读、审稿、数据分析、汇报材料）"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Keep heavyweight document/full-text libraries out of the service startup
# path.  Install only the export/parser capabilities needed by a deployment.
pdf = ["weasyprint>=70,<71", "CairoSVG>=2.8,<3"]
xlsx = ["openpyxl>=3.1,<4"]
fulltext = ["PyMuPDF>=1.24,<2"]

[project.scripts]
deep-research = "deep_research.cli:main"
deep-research-worker = "deep_research.worker:main"

[tool.setuptools.packages.find]
include = ["deep_research*"]
namespaces = false

[tool.setuptools.package-data]
deep_research = ["py.typed"]
"deep_research.intent" = ["models/*.json"]

[tool.setuptools.data-files]
"share/deep-research-agent" = ["alembic.ini"]
"share/deep-research-agent/alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"share/deep-research-agent/alembic/versions" = ["alembic/versions/*.py"]
"share/deep-research-agent/framework" = ["framework/01_planner_system_prompt.md", "framework/04_executor_prompt.md", "framework/05_aggregator_prompt.md", "framework/06_global_rules.md", "framework/09_long_research.md", "framework/10_research_plan.json"]
"share/deep-research-agent/framework/skills" = ["framework/skills/*.md"]
"share/deep-research-agent/frontend" = ["frontend/dist/index.html", "frontend/dist/*.js", "frontend/dist/*.svg", "frontend/dist/*.png", "frontend/dist/*.ico", "frontend/dist/*.webp"]
"share/deep-research-agent/frontend/assets" = ["frontend/dist/assets/*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"
# 本地参考资料包与遗留脚本不属于项目源码，CI 也只检查 deep_research/tests/alembic/scripts/eval
extend-exclude = ["apevon-full-package", "framework/run.py"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes，I: isort，UP: pyupgrade，B: bugbear，ASYNC: 异步陷阱
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true        # 第三方库（openai/tavily/...）无 stub 时不报错
disallow_untyped_defs = true
# 仅对核心包强制完整类型标注；tests/eval 不强制
files = ["deep_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pg: 需要 PostgreSQL 的集成测试（默认离线运行时以 -m 'not pg' 跳过）",
]
