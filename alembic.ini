# Alembic config: database schema migrations.
# The DB URL is NOT hard-coded here; alembic/env.py reads it from
# deep_research.config.Settings (DATABASE_URL) so the app and migrations
# share a single source of truth.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Timestamp-prefixed migration filenames, for chronological browsing
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
